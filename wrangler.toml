# Cloudflare Workers con asset statici (Workers Builds collegato a GitHub, vedi docs/DEPLOY.md).
# `name` deve coincidere con il nome del Worker nel dashboard.
name = "gaudenzi-liutaio-demo"
compatibility_date = "2026-10-01"
# Script minimo che serve solo i video con supporto Range (Safari/iOS); tutto il resto sono asset statici.
main = "worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
# Il Worker gira prima degli asset solo per questi percorsi.
run_worker_first = ["/assets/*.mp4"]
